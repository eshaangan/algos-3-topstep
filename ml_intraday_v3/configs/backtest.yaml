# Backtest configuration - offline evaluation only
# Version: 1.0

decision:
  # PHASE 5 FIX: Disable meta-model (was adding noise; ROC-AUC ~ 0.50).
  use_meta: false
  # Primary decision score (from preds.parquet). For multiclass models, we use:
  # score_ev = p_target - p_stop (expected-value style directional edge).
  primary_score_column: "score_ev"
  # Raise threshold to reduce low-edge trades (lower churn, better expectancy).
  primary_threshold: 0.15
  meta_threshold: 0.30
  require_meta_for_trade: false

  # Volatility filter (DISABLED to restore trade generation)
  # Previous analysis showed profitability with sigma>7.0, but threshold was too restrictive
  # combined with primary_threshold resulting in ~0 trades. Disabled for now.
  volatility_filter:
    enabled: false
    min_sigma: 7.0  # Only trade when volatility > 7.0 points (inactive when disabled)

  # Regime filter: Reduce/skip trades during dangerous market regimes
  # Regimes are combinations of volatility (low=0, med=1, high=2) and trend (down=0, sideways=1, up=2)
  # Combined regime = vol * 3 + trend:
  #   0: low_vol_downtrend, 1: low_vol_sideways, 2: low_vol_uptrend
  #   3: med_vol_downtrend, 4: med_vol_sideways, 5: med_vol_uptrend
  #   6: high_vol_downtrend (DANGEROUS), 7: high_vol_sideways, 8: high_vol_uptrend
  #
  # LONG/SHORT STRATEGY: Go long in uptrends, short in downtrends
  regime_filter:
    enabled: true
    vol_window: 20         # Bars for volatility regime computation
    trend_window: 50       # Bars for trend regime computation

    # BIDIRECTIONAL TRADING: Model evaluates both LONG and SHORT, picks best EV
    # trend_scanning labeling adds 'side' feature. At test time, predictor evaluates
    # both sides (side=1 and side=-1) and chooses the direction with higher EV.
    enable_shorts: false             # DISABLED: Not regime-based anymore, handled by bidirectional predictor
    downtrend_regimes: [0, 3, 6]     # (Unused - bidirectional handles this)
    uptrend_regimes: [2, 5, 8]       # (Unused - bidirectional handles this)

    # AGGRESSIVE FOR COMBINE: No regime-based filters
    skip_regimes: []                 # Trade all regimes
    threshold_boost_regimes: []      # No threshold boosts (removed sideways penalty)
    threshold_boost: 0.0             # No boost

sizing:
  contracts: 1
  # Cap concurrency to prevent pyramiding/stacking dominating P&L.
  max_concurrent_positions: 1

costs:
  use_execution_spec: true
  use_event_ret_net: true

risk:
  use_risk_yaml: true

session:
  flatten_time_chicago: "15:55"

outputs:
  write_trade_log: true
  write_equity_curve: true
