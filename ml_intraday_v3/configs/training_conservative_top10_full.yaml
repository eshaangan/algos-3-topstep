# Training configuration - CONSERVATIVE TOP10 FULL WINDOW
# Version: 4.1 - Final anti-overfitting config from Phase 2 experiment grid
# Updated: 2026-02-10
# Changes: 10 features + conservative regularization + FULL training window (2019-2025)
# Results: Median test AUC 0.5500, train-test gap -0.004, signals>0.55: 2

# Data Selection - FULL WINDOW (All available data)
# Phase 2 finding: Longer training windows improve generalization
# Full window (2019-2025) beats 6mo/12mo/24mo windows
data_selection:
  train_start: "2019-05-06"  # All available data (was 2025-06-01)
  train_end: "2025-11-30"    # End of training period
  test_start: "2025-12-01"   # Held-out test period
  test_end: "2025-12-31"

# Event Generation - BALANCED LONG/SHORT
event_generation:
  policy: "cusum"
  balance_events: true
  target_long_ratio: 0.50
  balance_method: "undersample"

# CONSERVATIVE MODEL: Moderate regularization, balanced complexity
model:
  kind: "lgbm"
  params:
    objective: "binary"
    n_estimators: 100        # Moderate (vs 50 aggressive, 150 baseline)
    learning_rate: 0.05
    num_leaves: 15           # Moderate (vs 7 aggressive, 31 baseline)
    max_depth: 4             # Moderate (vs 3 aggressive, 6 baseline)
    min_child_samples: 200   # Moderate (vs 300 aggressive, 100 baseline)
    subsample: 0.8
    subsample_freq: 5
    colsample_bytree: 0.8
    reg_alpha: 0.3           # Moderate L1 (vs 0.5 aggressive, 0.1 baseline)
    reg_lambda: 0.3          # Moderate L2 (vs 0.5 aggressive, 0.1 baseline)
    class_weight: "balanced"

# Hyperparameter Search - DISABLED for production
hyperparam_search:
  enabled: false

# TOP-10 FEATURES (from feature importance gain)
# More diversity than top-5, less noise than full 34
features:
  use_columns: "selected"
  selected_features:
    - side            # Gain: 149 (directional bias)
    - autocorr_5      # Gain: 104 (mean reversion)
    - vol_regime      # Gain: 91  (volatility state)
    - vol_20          # Gain: 90  (short-term vol)
    - ema_ratio       # Gain: 86  (trend strength)
    - relative_volume # Gain: 78  (volume divergence)
    - lower_wick      # Gain: 75  (rejection signal)
    - vol_forecast    # Gain: 75  (vol prediction)
    - parkinson_vol   # Gain: 73  (range-based vol)
    - ema_spread      # Gain: 65  (trend momentum)
  drop_meta_columns:
    - "is_synthetic"
    - "usable_for_training"

target:
  column: "y"
  mode: "binary"
  classes: [-1, 1]
  positive_label: 1
  flip_sign: false
  flip_ret_net: false

sample_weight:
  column: "w_final"
  enabled: true

# Sample decay weighting
# With full 6-year window, decay ensures recent data has more influence
sample_decay:
  enabled: true
  lambda: 0.005  # half-life ~140 days
  reference_date: null  # Auto-computed as most recent training date

preprocessing:
  scaler: "standard"
  impute: "median"

eval:
  metrics:
    - "accuracy"
    - "balanced_accuracy"
    - "log_loss"
    - "f1_macro"
    - "f1_weighted"
    - "roc_auc_target_vs_rest"
  threshold: 0.5

output:
  write_predictions: true
  write_model: true

seed: 42

date_filter:
  enabled: false

# Probability Calibration - ISOTONIC (proven to work)
# Phase 2 showed sigmoid collapses probabilities even more than isotonic
calibration:
  enabled: true
  method: "isotonic"  # Keep isotonic (sigmoid failed in Option 3)
  calibration_fraction: 0.20
  recalibrate_score_ev: true
  save_calibrator: true
  calibration_seed: 42

# Rare events corrections - only applies to logreg
rare_events:
  enabled: true
  tau: null
  use_sample_weights: true
  weight_method: "king_zeng"
  correction_method: "king_zeng"

# Meta model - DISABLED
# Conservative model is balanced enough without meta layer
meta:
  enabled: false
  threshold_primary: 0.20
  target:
    kind: "y_positive"
  features:
    include_primary_prob: true
    include_primary_logit: true
    include_original_features: true
  model:
    kind: "lgbm"
    params:
      n_estimators: 150
      learning_rate: 0.05
      num_leaves: 15
      max_depth: 3
      min_child_samples: 100
      subsample: 0.8
      subsample_freq: 5
      colsample_bytree: 0.8
      reg_alpha: 0.3
      reg_lambda: 0.3
  output:
    write_meta_predictions: true
    write_meta_model: true

# Walkforward schedule (not used in single-shot training)
walkforward:
  schedule:
    train_window_days: 180  # Not used when training on full window
    test_window_days: 21
    step_days: 21
    expanding: false
    min_train_events: 500
