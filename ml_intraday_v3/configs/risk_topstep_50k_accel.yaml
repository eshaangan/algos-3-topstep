# Accelerated Topstep 50K risk configuration for 5m bars.
# Goal: increase pass speed while keeping hard-rule breach probability low.
#
# Differences vs strict:
# - Less aggressive pre-breach flattening on daily loss / trailing DD
# - Higher trade-frequency caps
# - No daily profit lock (use consistency ratio policy instead)

topstep:
  account_type: "combine"
  starting_balance: 50000

daily_loss_limit:
  enabled: true
  # Internal buffer below Topstep's $1,000 limit.
  max_daily_loss: 900
  pnl_calculation: "realized_and_unrealized"
  reset_time: "17:00"
  reset_timezone: "America/Chicago"
  breach_action: "flatten_and_halt"

trailing_drawdown:
  enabled: true
  # Internal buffer below Topstep's $2,500 limit.
  max_drawdown: 2400
  pnl_calculation: "realized_and_unrealized"
  hwm_update_policy: "real_time"
  breach_action: "flatten_and_halt"

position_limits:
  max_contracts_per_position: 2
  max_concurrent_positions: 1
  max_total_contracts: 2
  max_notional_exposure: 30000

intraday_controls:
  max_trades_per_day: 100
  min_seconds_between_trades: 0
  max_consecutive_losses: 4
  consecutive_loss_action: "halt_trading"
  daily_profit_lock_usd: 0

forced_flatten:
  flatten_at_session_close: true
  # Pre-breach flattening: later than strict, still buffered.
  flatten_at_loss_threshold: 0.75
  flatten_at_drawdown_threshold: 0.85

# Live-only adaptive knobs (used by live_trading.risk_manager)
risk_management:
  enabled: true
  daily_loss_limit_usd: 1000
  daily_loss_warning_usd: 400
  daily_loss_critical_usd: 700

  base_position_size: 1
  reduce_size_on_loss: true
  size_after_warning: 1.0
  size_after_critical: 0.0

  max_drawdown_from_hwm: 2500
  drawdown_warning: 1500

  avoid_first_hour: true
  avoid_last_hour: true

  threshold_increase_on_loss: 0.03
  daily_profit_lock_usd: 0

risk_spec_version: "1.0.0"

