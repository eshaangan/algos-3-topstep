# Feature Configuration - Aligned with model_bundle_retrained_oct2024_nov2025.pkl
# CRITICAL: This MUST generate exactly the 34 features the model was trained on.
# Config keys MUST match what build_features() and get_feature_registry() expect.
#
# Model's 34 expected features:
#   log_return_1, log_return_2, log_return_4, log_return_6, log_return_12, log_return_24,
#   true_range, atr_14, vol_20, vol_regime, parkinson_vol, vol_forecast,
#   ema_13, ema_34, ema_spread, ema_ratio, sma_20, sma_30, trend_strength, autocorr_5, bb_position,
#   volume_imbalance, price_vs_vwap, relative_volume, large_move,
#   candle_body, candle_range, body_pct, upper_wick, lower_wick,
#   minute_of_day_sin, minute_of_day_cos, day_of_week,
#   is_synthetic

computation:
  eps: 1.0e-8
  nan_policy: "keep_with_mask"

# Normalization: DISABLED (model was trained without it)
normalization:
  enabled: false

# Returns: generate log_return_1, 2, 4, 6, 12, 24
returns:
  lookback_bars:
    1m: [3, 6]
    5m: [2, 4]
  enable_multi_horizon: true
  multi_horizon_bars: [6, 12, 24]

# Volatility: generate true_range, atr_14, vol_20, vol_regime, parkinson_vol, vol_forecast
volatility:
  atr_period: 14
  enable_regime_features: true
  vol_regime_lookback: 50

# Trend: generate ema_13, ema_34, ema_spread, ema_ratio, sma_20, sma_30, trend_strength, autocorr_5, bb_position
trend:
  ema_fast_period: 13
  ema_slow_period: 34
  enable_advanced_features: true
  sma_long_period: 30

# Momentum: DISABLED (not in model's 34 features)
momentum:
  enabled: false

# Microstructure: generate volume_imbalance, price_vs_vwap, relative_volume, large_move
microstructure:
  enabled: true

# Structure: generate candle_body, candle_range, body_pct, upper_wick, lower_wick
structure:
  enabled: true

# Time: generate minute_of_day_sin, minute_of_day_cos, day_of_week
time:
  enabled: true
  minutes_per_session: 1440

# Output: generate is_synthetic flag
output:
  include_synthetic_flag: true
