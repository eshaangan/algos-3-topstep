# Position Sizing Configuration
# Used by: live trading, backtesting with tiered sizing enabled
# Version: 2.0 (Updated for $150/day target)

# Tiered Position Sizing Parameters
tiered_sizing:
  enabled: true

  # Base position size (number of contracts)
  # UPDATED: 2 contracts to achieve $150/day minimum (Topstep withdrawal requirement)
  # Analysis: $22.92/trade × 2 contracts × 6-7 trades/day = $137-160/day
  base_size: 2  # Was: 1

  # Maximum position size (Topstep 50k limit)
  max_size: 2

  # Minimum position size
  min_size: 1

  # Confidence Thresholds (for LONG trades)
  # SHORT trades use inverse: P(down) = 1 - P(up)
  high_confidence_threshold: 0.65   # P > 0.65
  medium_confidence_threshold: 0.55  # P > 0.55
  low_confidence_threshold: 0.50     # P > 0.50

  # Size Multipliers by Confidence Tier
  # Final size = base_size × multiplier (capped at max_size)

  # High confidence: Use max size (2 contracts)
  # 2 contracts × 1.0 = 2 contracts
  high_confidence_multiplier: 1.0  # Was: 1.5 (would give 3, but capped at 2)

  # Medium confidence: Use max size (2 contracts)
  # 2 contracts × 1.0 = 2 contracts
  medium_confidence_multiplier: 1.0

  # Low confidence: Use half size (1 contract)
  # 2 contracts × 0.5 = 1 contract
  low_confidence_multiplier: 0.5

  # Risk Management
  # If false, reject low confidence trades entirely
  allow_low_confidence: false  # Only trade medium+ confidence with 2-contract base

# Risk Limits (Topstep 50k Rules)
risk_limits:
  # Daily loss limit (stop trading if hit)
  daily_loss_limit: -1000.0  # Topstep rule

  # Maximum single trade loss (with 2 contracts)
  # Typical stop: ~20-25 points × $5/point × 2 contracts = $200-250
  max_single_trade_loss: -250.0

  # Trailing max drawdown
  trailing_max_drawdown: -2500.0  # Topstep rule

# Expected Performance (2-Contract Base)
expected_performance:
  # With confidence filter (0.55) first, then tiered sizing
  trades_per_day: 5-7
  win_rate: 0.58-0.62
  avg_trade_pnl: 22.92  # Per trade with 2 contracts
  daily_pnl: 150-250    # 6 trades × $22.92 = $137-160/day
  days_to_3000: 12-20   # Topstep combine target

# Configuration Notes
notes: |
  Updated to 2-contract base size to achieve Topstep withdrawal requirements.

  Rationale:
  - Topstep allows up to 2 contracts simultaneously
  - $150/day minimum needed for withdrawal rules
  - With improvements: ~$22.92/trade avg
  - 2 contracts × 6 trades/day = $137/day
  - 2 contracts × 7 trades/day = $160/day

  Integration Order (CRITICAL):
  1. Confidence Filter (0.55) → Filters out P < 0.55
  2. Regime Detector → Pauses if regime shift
  3. Volatility Filter → Only normal vol (30-70th pct)
  4. Tiered Sizing → Scales 2 contracts by confidence
  5. Circuit Breaker → Monitors performance

  This ensures we get 5-7 quality trades/day (not 2.5 from simulation).

version: "2.0.0"
