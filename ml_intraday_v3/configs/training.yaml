# Training configuration - primary model
# Version: 3.0 - SHORTER WINDOWS + SAMPLE DECAY + BALANCED BIDIRECTIONAL
# Updated: 2026-02-10
# Changes: Phase 3 - 6-month rolling windows, sample decay weighting

# Data Selection - SHORTENED TO RECENT 6 MONTHS
# Phase 3: Financial regimes shift every 2-4 months. 14-month windows average
# across conflicting regimes. 6-month windows focus on current regime.
data_selection:
  train_start: "2025-06-01"  # Recent 6 months only (was 2024-01-01)
  train_end: "2025-11-30"    # End of training period
  test_start: "2025-12-01"   # Held-out test period
  test_end: "2025-12-31"

# Event Generation - BALANCED LONG/SHORT
event_generation:
  policy: "cusum"
  balance_events: true
  target_long_ratio: 0.50
  balance_method: "undersample"

model:
  kind: "lgbm"
  params:
    objective: "binary"
    n_estimators: 150
    learning_rate: 0.05
    num_leaves: 31
    max_depth: 6
    min_child_samples: 100
    subsample: 0.8
    subsample_freq: 5
    colsample_bytree: 0.8
    reg_alpha: 0.1
    reg_lambda: 0.1
    class_weight: "balanced"

# Hyperparameter Search with Trial Tracking (for PBO analysis)
hyperparam_search:
  enabled: false

  model:
    kind: "lgbm"
    param_grid:
      n_estimators: [300, 500, 1000]
      learning_rate: [0.01, 0.05, 0.1]
      max_depth: [4, 6, 8]

  fixed_params:
    min_child_samples: 100
    subsample: 0.8
    subsample_freq: 5
    colsample_bytree: 0.8
    reg_alpha: 0.1
    reg_lambda: 0.1

features:
  use_columns: "all"
  drop_meta_columns:
    - "is_synthetic"
    - "usable_for_training"

target:
  column: "y"
  mode: "binary"
  classes: [-1, 1]
  positive_label: 1
  flip_sign: false
  flip_ret_net: false

sample_weight:
  column: "w_final"
  enabled: true

# Phase 3: Sample decay weighting
# Exponentially decay older samples so model prioritizes recent patterns.
# Combined with uniqueness weights via: w_combined = w_final * w_decay
sample_decay:
  enabled: true
  # Decay rate lambda: w = exp(-lambda * age_days)
  # lambda=0.005 => half-life ~140 days
  lambda: 0.005
  # Reference point: most recent training date (auto-computed if null)
  reference_date: null

preprocessing:
  scaler: "standard"
  impute: "median"

eval:
  metrics:
    - "accuracy"
    - "balanced_accuracy"
    - "log_loss"
    - "f1_macro"
    - "f1_weighted"
    - "roc_auc_target_vs_rest"
  threshold: 0.5

output:
  write_predictions: true
  write_model: true

seed: 42

date_filter:
  enabled: false

# Probability Calibration (Isotonic Regression)
calibration:
  enabled: true
  method: "isotonic"
  calibration_fraction: 0.20
  recalibrate_score_ev: true
  save_calibrator: true
  calibration_seed: 42

# Rare events corrections (King & Zeng 2001) - only applies when model.kind == "logreg"
rare_events:
  enabled: true
  tau: null
  use_sample_weights: true
  weight_method: "king_zeng"
  correction_method: "king_zeng"

meta:
  enabled: true
  threshold_primary: 0.20
  target:
    kind: "y_positive"
  features:
    include_primary_prob: true
    include_primary_logit: true
    include_original_features: true
  model:
    kind: "lgbm"
    params:
      n_estimators: 150
      learning_rate: 0.05
      num_leaves: 15
      max_depth: 3
      min_child_samples: 100
      subsample: 0.8
      subsample_freq: 5
      colsample_bytree: 0.8
      reg_alpha: 0.3
      reg_lambda: 0.3
  output:
    write_meta_predictions: true
    write_meta_model: true

# Walkforward schedule (Phase 3: shorter rolling windows)
walkforward:
  schedule:
    train_window_days: 180  # 6 months (was 365+)
    test_window_days: 21    # 1 month test
    step_days: 21           # Step forward 1 month
    expanding: false        # Fixed rolling window (not expanding)
    min_train_events: 500   # Minimum events to train a window

# Experiment-time CV options (used by comprehensive grid search v2)
cv_method: kfold
cpcv:
  n_splits: 5
  n_test_splits: 2
  purge_pct: 0.02
  embargo_pct: 0.01
  selection: balanced

# Experiment-time sample-weighting policy
sample_weighting:
  method: uniqueness_decay
  lambda: 0.005
