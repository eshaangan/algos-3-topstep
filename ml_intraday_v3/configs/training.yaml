# Training configuration - primary model
# Version: 2.0 - BALANCED TRAINING FOR BIDIRECTIONAL TRADING
# Updated: 2026-01-25
# Changes: Extended date range, balanced LONG/SHORT events, regime-aware training

# Data Selection - EXTENDED TO INCLUDE MULTIPLE MARKET REGIMES
data_selection:
  train_start: "2024-01-01"  # Include Q1 2024 bearish period
  train_end: "2025-11-30"    # Extended to Nov 2025
  test_start: "2025-12-01"   # Held-out test period
  test_end: "2025-12-31"
  
# Event Generation - BALANCED LONG/SHORT
# NOTE: Actual event policy and sides come from labeling.yaml (primary_labeling.event_policy).
# For unbiased bidirectional training use labeling: event_policy: "cusum", cusum.sides: [1, -1].
event_generation:
  policy: "cusum"           # Must match labeling.yaml for unbiased bidirectional
  balance_events: true      # Balance LONG/SHORT distribution
  target_long_ratio: 0.50   # Target 50% LONG, 50% SHORT
  balance_method: "undersample"  # Options: undersample, oversample

model:
  kind: "lgbm"  # LightGBM for non-linear pattern capture
  params:
    # LightGBM parameters - BALANCED for bidirectional trading
    n_estimators: 150  # Reduced from 300 (balanced data needs less capacity)
    learning_rate: 0.05
    num_leaves: 31
    max_depth: 6  # Increased from 4 for better pattern capture
    min_child_samples: 100  # Increased from 150 (balanced data allows stricter requirements)
    subsample: 0.8  # Bagging fraction (row sampling)
    subsample_freq: 5
    colsample_bytree: 0.8  # Feature fraction (column sampling)
    reg_alpha: 0.1  # L1 regularization - reduced for balanced data
    reg_lambda: 0.1  # L2 regularization - reduced for balanced data
    class_weight: null  # Disabled - data is pre-balanced

# Hyperparameter Search with Trial Tracking (for PBO analysis)
hyperparam_search:
  enabled: false  # Set to true to run grid search with TrialTracker

  model:
    kind: "lgbm"  # Model type for grid search

    # Parameter grid - all combinations will be tested
    # WARNING: Grid size = product of all list lengths
    # Example below: 3 x 3 x 3 = 27 trials
    param_grid:
      # Number of boosting iterations
      n_estimators: [300, 500, 1000]

      # Learning rate (eta)
      learning_rate: [0.01, 0.05, 0.1]

      # Tree complexity
      max_depth: [4, 6, 8]

      # Optional: Add more parameters to search
      # num_leaves: [15, 31, 63]
      # min_child_samples: [50, 100, 200]
      # subsample: [0.7, 0.8, 0.9]
      # colsample_bytree: [0.7, 0.8, 0.9]
      # reg_alpha: [0.0, 0.1, 0.5]
      # reg_lambda: [0.0, 0.1, 0.5]

  # Fixed parameters (not searched over)
  fixed_params:
    min_child_samples: 100
    subsample: 0.8
    subsample_freq: 5
    colsample_bytree: 0.8
    reg_alpha: 0.1
    reg_lambda: 0.1

features:
  use_columns: "all"  # or explicit list
  drop_meta_columns:
    - "is_synthetic"
    - "usable_for_training"

target:
  column: "y"
  # Multiclass: stop / vertical / target
  mode: "multiclass"
  classes: [-1, 0, 1]
  positive_label: 1  # only used in binary mode
  flip_sign: false
  flip_ret_net: false

sample_weight:
  column: "w_final"
  enabled: true

preprocessing:
  scaler: "standard"
  impute: "median"

eval:
  metrics:
    - "accuracy"
    - "balanced_accuracy"
    - "log_loss"
    - "f1_macro"
    - "f1_weighted"
    - "roc_auc_target_vs_rest"
  threshold: 0.5

output:
  write_predictions: true
  write_model: true

seed: 42

# Date filtering - DISABLED (filtering done via data_selection above)
date_filter:
  enabled: false

# Probability Calibration (Isotonic Regression)
# Fixes miscalibrated probability estimates from the model
# IMPORTANT: Enabled by default for multiclass to fix systematic overconfidence
calibration:
  enabled: true  # Enable isotonic calibration

  # Method: "isotonic" (non-parametric, recommended) or "platt" (logistic)
  method: "isotonic"

  # Fraction of training data to hold out for calibration fitting
  # Larger = better calibration but less training data
  # 0.15-0.25 is typically a good range
  calibration_fraction: 0.20

  # Whether to recalibrate score_ev from calibrated probabilities
  recalibrate_score_ev: true

  # Save calibrator alongside model
  save_calibrator: true

  # Random seed for train/calibration split
  calibration_seed: 42

# Rare events corrections (King & Zeng 2001) - only applies when model.kind == "logreg"
rare_events:
  enabled: true

  # Prior probability of positive class (profitable trade)
  # Set to null to auto-estimate from training data
  # Or provide known value (e.g., 0.35 for 35% win rate)
  tau: null  # Auto-estimate from data

  # Use sample weighting during training (King & Zeng method)
  use_sample_weights: true

  # Method for computing sample weights
  # Options: "king_zeng", "inverse_freq", "balanced"
  weight_method: "king_zeng"

  # Method for correcting predicted probabilities
  # Options: "king_zeng", "simple"
  correction_method: "king_zeng"

meta:
  # Meta-model for signal quality filtering
  enabled: true
  threshold_primary: 0.20  # Default (best so far in quick OOS checks)
  target:
    kind: "y_positive"  # y_positive | ret_net_positive | y_and_ret_net
  features:
    include_primary_prob: true
    include_primary_logit: true
    include_original_features: true
  model:
    kind: "lgbm"  # LightGBM for meta-model
    params:
      n_estimators: 150
      learning_rate: 0.05
      num_leaves: 15  # Shallower trees for meta-model
      max_depth: 3
      min_child_samples: 100
      subsample: 0.8
      subsample_freq: 5
      colsample_bytree: 0.8
      reg_alpha: 0.3
      reg_lambda: 0.3
  output:
    write_meta_predictions: true
    write_meta_model: true
