# Promotion gates for the standalone candidate using a shorter rolling lookback.
# This keeps the same December-April evaluation windows but refreshes the
# training slice more aggressively to test recency sensitivity.

data:
  bar_size: "5m"
  additional_paths:
    - "data/processed/mes_2026_ytd_rth_5m.h5"

training_window:
  lookback_days: 120
  gap_days: 0

windows:
  - name: "dec_2025_bull"
    test_start: "2025-12-01"
    test_end: "2025-12-31"

  - name: "jan_2026_regime_shift"
    test_start: "2026-01-01"
    test_end: "2026-01-31"

  - name: "feb_2026_followthrough"
    test_start: "2026-02-01"
    test_end: "2026-02-28"

  - name: "mar_2026_extension"
    test_start: "2026-03-01"
    test_end: "2026-03-31"

  - name: "apr_2026_partial"
    test_start: "2026-04-01"
    test_end: "2026-04-10"

gates:
  min_train_events: 250
  min_test_events: 30
  min_test_auc: 0.52
  min_test_accuracy: 0.50

  min_total_pnl_usd: 0.0
  min_avg_trade_usd: 3.0
  min_profit_factor: 1.05
  min_win_rate: 0.45
  min_trades_count: 10
  min_positive_prediction_rate: 0.02

  max_drawdown_usd: 1200.0
  max_mtm_daily_liquidations: 0
  max_mtm_trailing_liquidations: 0

  min_long_share: 0.20
  max_long_share: 0.80
  min_short_share: 0.20
  max_short_share: 0.80

  require_all_windows: true
  min_pass_ratio: 1.0
  min_total_pnl_usd_overall: 500.0
  min_long_share_overall: 0.25
  max_long_share_overall: 0.75
  min_short_share_overall: 0.25
  max_short_share_overall: 0.75
