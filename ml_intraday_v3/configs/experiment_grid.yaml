# Experiment grid configuration - offline evaluation only
# Version: 1.0

# Use CPCV when running selection diagnostics (PBO).
cv_kind: "cpcv"

training_config: "ml_intraday_v3/configs/training.yaml"
backtest_config: "ml_intraday_v3/configs/backtest.yaml"
execution_spec: "ml_intraday_v3/configs/execution_spec.yaml"
risk_config: "ml_intraday_v3/configs/risk.yaml"

grid:
  # Threshold sweep for selection + overfitting diagnostics.
  # Keep small by default; expand as you iterate.
  primary_threshold: [0.05, 0.10, 0.15]
  meta_threshold: [0.30]

diagnostics:
  # Prefer a risk-adjusted metric for selection; PBO/DSR assumes you're selecting
  # among many candidates.
  selection_metric: "total_pnl_usd"
  compute_pbo: true
  compute_dsr: true
  # Set to the effective number of configs you've tried overall (be conservative).
  n_trials: 10
  target_sharpe: 0.0
