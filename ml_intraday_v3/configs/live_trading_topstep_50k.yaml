# Live config tuned for Topstep 50K combine pass probability (5m bars).
# This is intentionally more conservative than live_trading.yaml.

trading:
  environment: "paper"
  enabled: true
  dry_run: false
  bar_size: "5m"
  # Set explicitly to avoid relying on walkforward auto-detection.
  model_bundle_path: "ml_intraday_v3/models/saved/model_bundle_topstep_candidate.pkl"

data:
  provider: "databento"
  symbol: "MES"
  schema: "ohlcv-1m"
  update_frequency_seconds: 60
  lookback_bars: 150
  enable_rth_filter: true

topstep:
  base_url: "https://api.topstepx.com"
  contract_id: "CON.F.US.MES.H26"
  account_id_env_var: "TOPSTEPX_ACCOUNT_ID"
  api_key_env_var: "TOPSTEPX_PROJECTX_API_KEY"
  session_token_env_var: "TOPSTEPX_SESSION_TOKEN"
  order:
    type: "MARKET"
    time_in_force: "DAY"
    use_brackets: true

signals:
  # Match backtest_topstep_strict.yaml intent: fewer, higher-quality trades.
  primary_threshold: 0.08
  use_meta_model: false
  meta_threshold: 0.50
  require_meta_approval: false

  volatility_filter:
    enabled: false
    min_sigma: 7.0

positions:
  contracts_per_trade: 1
  max_concurrent: 1
  flatten_at_close: true
  session_close_time: "16:00"
  flatten_buffer_minutes: 10

# Kelly sizing disabled for combine safety.
kelly_sizing:
  enabled: false
  min_trades_for_kelly: 20
  kelly_fraction: 0.25
  rolling_window_trades: 50
  max_contracts_per_trade: 1
  min_contracts: 1
  confidence_boost:
    enabled: false
    boost_factor: 1.5
    boost_threshold: 0.15
  negative_kelly_threshold: 3
  log_sizing_decisions: false

risk:
  use_risk_yaml: true
  use_risk_manager: true

  # Point live runner to strict risk config.
  risk_config_path: "ml_intraday_v3/configs/risk_topstep_50k_strict.yaml"

monitoring:
  log_level: "INFO"
  log_file: "logs/live_trading_{timestamp}.log"
  trade_log: "logs/trades_{timestamp}.csv"
  equity_log: "logs/equity_{timestamp}.csv"
  alerts:
    alert_on_trade: true
    alert_on_risk_breach: true
    alert_on_error: true
    method: "log"

health:
  api_check_interval_seconds: 300
  model_check_interval_bars: 60
  check_feature_quality: true
  halt_on_health_failure: true

reconciliation:
  sync_interval_seconds: 60
  reconcile_pnl: true
  halt_on_mismatch: true
  pnl_mismatch_tolerance: 10.0

startup:
  checks:
    - "api_connection"
    - "model_loaded"
    - "risk_config_valid"
    - "data_connection"
    - "broker_account_valid"
  require_manual_confirmation: true
  display_account_status: true

session:
  # RTH (America/Chicago): 08:30 - 15:00
  sessions:
    - name: "rth"
      start_time: "08:30"
      end_time: "15:00"
      timezone: "America/Chicago"
  no_entry_before_close_minutes: 15

version: "1.0.0"
last_updated: "2026-01-15"

