# Accelerated Topstep backtest: base 3 contracts, dynamically scaled by sigma.
# Intended to improve pass speed while keeping high-sigma exposure low.

decision:
  use_meta: false
  primary_score_column: "score_ev"
  primary_threshold: 0.06
  meta_threshold: 0.50
  require_meta_for_trade: false

  volatility_filter:
    enabled: false
    min_sigma: 7.0

  regime_filter:
    enabled: true
    vol_window: 20
    trend_window: 50
    enable_shorts: false
    skip_regimes: [6, 7]
    threshold_boost_regimes: [3]
    threshold_boost: 0.03

sizing:
  contracts: 3
  max_concurrent_positions: 1
  dynamic_contracts:
    enabled: true
    sigma_thresholds:
      - max_sigma: 20.0
        contracts: 3
      - max_sigma: 30.0
        contracts: 2
      - max_sigma: 45.0
        contracts: 1
      - max_sigma: 1.0e9
        contracts: 0

costs:
  use_execution_spec: true
  use_event_ret_net: true

risk:
  use_risk_yaml: true

session:
  trade_start_time_chicago: "08:30"
  trade_end_time_chicago: "15:00"
  flatten_time_chicago: "14:55"

outputs:
  write_trade_log: true
  write_equity_curve: true

