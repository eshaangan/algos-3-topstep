# Backtest config for the stronger-recency standalone candidate variant.
# Derived from the expanded 2026 OOS sweep: lower long threshold, base short
# threshold unchanged, and a lighter regime overlay that preserves December
# while improving the March extension window.

decision:
  use_meta: false
  primary_score_column: "y_prob"
  primary_threshold: 0.38
  primary_threshold_by_side:
    long: 0.38
    short: 0.48
  meta_threshold: 0.50
  require_meta_for_trade: false

  volatility_filter:
    enabled: false
    min_sigma: 0.0
    max_sigma: 0.0

  regime_filter:
    enabled: true
    vol_window: 20
    trend_window: 50
    skip_regimes: []
    threshold_boost_regimes: []
    threshold_boost: 0.0
    enable_shorts: false
    overlay_rules:
      - name: "tighten_weak_long_regimes"
        regimes: [1, 2, 3, 4]
        side: "long"
        threshold_boost: 0.10
      - name: "tighten_medvol_downtrend_shorts"
        regimes: [3]
        side: "short"
        threshold_boost: 0.03

sizing:
  contracts: 1
  max_concurrent_positions: 1

costs:
  use_execution_spec: true
  use_event_ret_net: true

risk:
  use_risk_yaml: true

session:
  flatten_time_chicago: "15:55"
  trade_start_time_chicago: "09:30"
  trade_end_time_chicago: "16:00"

outputs:
  write_trade_log: true
  write_equity_curve: true
