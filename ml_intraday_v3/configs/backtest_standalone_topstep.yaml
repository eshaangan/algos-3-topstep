# Backtest config for the standalone Topstep candidate.
# Unlike the combine-oriented config, this uses the model's direct target-hit
# probability and does not import an external volatility gate.

decision:
  use_meta: false
  primary_score_column: "y_prob"
  # PT=3.0 ATR and SL=2.5 ATR imply a rough breakeven hit rate in the mid-40%s
  # before costs. Side-specific thresholds tested better than a single cutoff:
  # lower for longs to reduce under-selection, higher for shorts to reduce
  # the strong short skew.
  primary_threshold: 0.46
  primary_threshold_by_side:
    long: 0.40
    short: 0.48
  meta_threshold: 0.50
  require_meta_for_trade: false

  volatility_filter:
    enabled: false
    min_sigma: 0.0
    max_sigma: 0.0

  regime_filter:
    enabled: true
    vol_window: 20
    trend_window: 50
    skip_regimes: []
    threshold_boost_regimes: []
    threshold_boost: 0.0
    enable_shorts: false
    overlay_rules:
      # The expanded 2026 OOS sweep showed that these long-side regimes were
      # the biggest source of avoidable drawdown, especially in March.
      - name: "tighten_weak_long_regimes"
        regimes: [1, 2, 3, 4]
        side: "long"
        threshold_boost: 0.12

      # Shorts were mostly fine, but med-vol downtrend shorts were still a
      # repeat offender. Tighten them slightly without collapsing Jan into
      # a degenerate all-short candidate.
      - name: "tighten_medvol_downtrend_shorts"
        regimes: [3]
        side: "short"
        threshold_boost: 0.06

sizing:
  contracts: 1
  max_concurrent_positions: 1

costs:
  use_execution_spec: true
  use_event_ret_net: true

risk:
  use_risk_yaml: true

session:
  flatten_time_chicago: "15:55"
  trade_start_time_chicago: "09:30"
  trade_end_time_chicago: "16:00"

outputs:
  write_trade_log: true
  write_equity_curve: true
