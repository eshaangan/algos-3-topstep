# Data configuration - ingestion, continuization, and reindexing
# Version: 1.0

# Raw data sources
raw_data:
  # Path to raw data files (relative to project root)
  # Expected format: HDF5, Parquet, or CSV with OHLCV columns
  input_path: "data/raw/GLBX-20251220-LWFB9HCEL5/glbx-mdp3-20100606-20251219.ohlcv-1m.csv"

  # Expected columns in raw data
  required_columns:
    - "open"
    - "high"
    - "low"
    - "close"
    - "volume"

# Data filtering and cleaning
filtering:
  # Enable filtering
  enabled: true

  # Date filtering - only use recent data for trading relevance
  date_filter:
    enabled: true
    min_date: "2022-07-01"  # Start mid-2022 (after Fed rate hike transition period)
    max_date: null  # null = use all data up to present

  # Symbol filtering (for raw CSV data with symbol column)
  symbol_filter:
    enabled: true
    mode: "exclude_patterns"  # "exclude_patterns" or "include_patterns"
    exclude_patterns:
      - ".*-.*"  # Exclude spread contracts (symbols containing "-")

  # Price validation (ES/MES futures typically 100-10000)
  price_validation:
    enabled: true
    min_price: 100.0    # Floor for ES/MES prices
    max_price: 10000.0  # Ceiling for ES/MES prices
    violation_action: "drop_bar"  # "drop_bar", "warn", or "raise"

  # Logging
  log_filtered_stats: true

# Ingestion configuration
ingestion:
  # Input format
  format: "csv"  # "hdf5", "parquet", or "csv"
  # HDF5 key (required unless file has a single key)
  hdf_key: "/bars_5min"
  # Timestamp column name (if not index, or null for auto-detection)
  timestamp_col: "ts_event"

# Canonical bar size for raw data (source resolution)
canonical_bar_size: "1m"

# Bar sizes to write (cannot upsample beyond canonical without explicit support)
bar_sizes_to_write:
  - "1m"

# Contract continuization
continuization:
  # Continuization mode: "already_continuous" or "calendar_roll"
  mode: "already_continuous"

  # Required for calendar_roll: CSV with columns [contract, roll_datetime_utc]
  roll_schedule_path: null

  # Roll-day policy: "exclude" or "keep"
  # "exclude" (DEFAULT): Drop entire day when roll occurs
  # "keep": Keep all bars on roll day
  roll_day_policy: "exclude"

# Reindexing configuration
reindexing:
  # Bar sizes to generate (fallback if bar_sizes_to_write is not set)
  bar_sizes:
    - "1m"

  # Resampling policy
  # "build_1m_resample_5m": build canonical 1m, then resample to 5m
  # "native": use native bar size from data source
  resample_policy: "native"

  # Grid generation mode
  # "full_range": full min->max grid (can create large missing gaps)
  # "session": session-aware grid (recommended for intraday futures)
  grid_mode: "session"
  session_grid: "rth"      # "rth" or "eth"
  exclude_weekends: true
  day_selection_mode: "data_present"  # "data_present" or "all_days_in_range"
  min_rows_per_day: 1

  # Sparse session-day exclusion (root-cause fix for QA failures on sparse days)
  # If enabled, session days with coverage < min_day_coverage_pct are excluded
  # from the grid entirely (those timestamps will not exist in output)
  drop_sparse_days: true
  min_day_coverage_pct: 0.90  # Exclude days with <90% coverage (0.0-1.0)
  coverage_session: "rth"      # Session definition to use for coverage computation

  # Missing bar handling (RESEARCH-GRADE DEFAULTS)
  missing_bars:
    # How to fill missing bars: "nan" or "forward_fill"
    # "nan" (DEFAULT - research-grade): Keep missing bars as NaN
    #   - No synthetic price paths created
    #   - Forces explicit handling downstream
    #   - Models/features must handle NaN appropriately
    # "forward_fill" (RISKY): Forward-fill OHLCV from prior bar
    #   - Creates synthetic price paths
    #   - Sets volume=0 on filled bars
    #   - Only use if you understand the implications
    missing_fill_mode: "nan"

    # Maximum consecutive missing bars to forward-fill
    # Only used if missing_fill_mode="forward_fill"
    # Set to 0 to disable forward-filling entirely
    forward_fill_max_consecutive: 0

    # Mark synthetic/filled bars in output (always true for safety)
    add_synthetic_flag: true

  # Timezone for stored data
  output_timezone: "UTC"

  # Session labeling (for features/filters, not trading constraints)
  session_labeling:
    timezone: "America/Chicago"
    sessions:
      - name: "rth"
        start_time: "08:30"
        end_time: "15:00"
      - name: "eth"  # Extended hours (for features only, not trading)
        start_time: "17:00"
        end_time: "16:00"  # Wraps midnight

# Quality assurance (RESEARCH-GRADE FAIL-FAST DEFAULTS)
qa:
  # QA report output path
  qa_report_path: "runs/{run_id}/bar_size={bar_size}/qa_report.json"

  # Fail-fast mode: halt pipeline on violations (DEFAULT: true)
  # true (DEFAULT - research-grade): Raise exception and stop on any violation
  #   - Ensures data quality issues are fixed immediately
  #   - Prevents garbage-in-garbage-out
  # false (WARNING MODE): Write violations to qa_report.json but continue
  #   - Use ONLY for debugging or exploration
  #   - NOT recommended for production runs
  qa_fail_fast: true

  # QA checks to perform
  checks:
    - "monotonic_index"      # Timestamps must be strictly increasing
    - "no_duplicates"        # No duplicate timestamps
    - "no_duplicates_after_merge"  # Duplicate timestamps after contract merge
    - "missing_bar_pct"      # Report % missing bars per day
    - "ohlc_validity"        # L <= O,C <= H
    - "volume_sanity"        # Volume >= 0

  # Failure thresholds (enforced if qa_fail_fast=true)
  thresholds:
    max_missing_bar_pct_per_day: 10.0  # Fail if >10% bars missing in a day
    max_ohlc_violations: 0              # Fail if any OHLC violations
    max_duplicate_timestamps: 0         # Fail if any duplicate timestamps

# Output paths (artifact storage per bar size)
output:
  bars_path: "runs/{run_id}/bar_size={bar_size}/bars.parquet"
  metadata_path: "runs/{run_id}/bar_size={bar_size}/data_metadata.json"

# Feature scaling and regime-aware normalization
feature_scaling:
  # Scaling method:
  # - "standard": Standard scaling (mean=0, std=1) across all data
  # - "robust": Robust scaling using median and IQR (less sensitive to outliers)
  # - "regime_aware": Regime-specific scaling to prevent distribution shift
  method: "regime_aware"

  # Regime detection configuration (only used if method="regime_aware")
  regime_detection:
    enabled: true

    # Volatility regime detection
    volatility:
      window: 20  # Rolling window for volatility computation (bars)
      n_regimes: 3  # Number of regimes: 3 = low/medium/high
      method: "quantile"  # Classification method

    # Trend regime detection
    trend:
      window: 50  # Rolling window for trend computation (bars)
      n_regimes: 3  # Number of regimes: 3 = down/sideways/up
      method: "slope"  # "slope" or "ma_diff"

    # Combined regime (volatility × trend)
    use_combined: true  # If true, use vol×trend combined regime for scaling

    # Minimum samples per regime for reliable statistics
    min_samples_per_regime: 10

    # Fallback to global statistics if regime has insufficient samples
    fallback_to_global: true

  # Probability calibration (for model outputs)
  calibration:
    enabled: true

    # Calibration method:
    # - "isotonic": Isotonic regression (non-parametric, flexible)
    # - "platt": Platt scaling (logistic regression, parametric)
    method: "isotonic"

    # Number of bins for calibration evaluation
    n_bins: 10

    # Validation: compute calibration metrics (ECE, MCE, Brier score)
    compute_metrics: true

# Data version
data_spec_version: "1.0.0"
