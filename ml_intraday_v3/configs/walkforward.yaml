# Walk-forward evaluation configuration
# Version: 1.0

schedule:
  train_window_days: 60
  test_window_days: 5
  step_days: 5
  # Minimum labeled events required to train a window; too high will cause all windows to skip.
  min_train_events: 500

retrain_policy:
  max_model_age_days: 7
  retrain_on_drift: false

evaluation:
  bar_sizes: ["5m"]
  thresholds:
    # Keep aligned with `ml_intraday_v3/configs/backtest.yaml` (multiclass EV score uses small thresholds).
    primary_threshold: 0.10
  use_meta: false
