# Training configuration - primary model (LONG-only)
# This is based on `training.yaml` with target.side_filter = 1.

data_selection:
  train_start: "2024-01-01"
  train_end: "2025-11-30"
  test_start: "2025-12-01"
  test_end: "2025-12-31"

event_generation:
  policy: "trend_scanning"
  balance_events: true
  target_long_ratio: 0.50
  balance_method: "undersample"

model:
  kind: "lgbm"
  params:
    n_estimators: 150
    learning_rate: 0.05
    num_leaves: 31
    max_depth: 6
    min_child_samples: 100
    subsample: 0.8
    subsample_freq: 5
    colsample_bytree: 0.8
    reg_alpha: 0.1
    reg_lambda: 0.1
    class_weight: null

hyperparam_search:
  enabled: false
  model:
    kind: "lgbm"
    param_grid:
      n_estimators: [300, 500, 1000]
      learning_rate: [0.01, 0.05, 0.1]
      max_depth: [4, 6, 8]
  fixed_params:
    min_child_samples: 100
    subsample: 0.8
    subsample_freq: 5
    colsample_bytree: 0.8
    reg_alpha: 0.1
    reg_lambda: 0.1

features:
  use_columns: "all"
  drop_meta_columns:
    - "is_synthetic"
    - "usable_for_training"

target:
  column: "y"
  mode: "multiclass"
  classes: [-1, 0, 1]
  positive_label: 1
  flip_sign: false
  flip_ret_net: false
  side_filter: 1

sample_weight:
  column: "w_final"
  enabled: true

preprocessing:
  scaler: "standard"
  impute: "median"

eval:
  metrics:
    - "accuracy"
    - "balanced_accuracy"
    - "log_loss"
    - "f1_macro"
    - "f1_weighted"
    - "roc_auc_target_vs_rest"
  threshold: 0.5

output:
  write_predictions: true
  write_model: true

seed: 42

date_filter:
  enabled: false

calibration:
  enabled: true
  method: "isotonic"
  calibration_fraction: 0.20
  recalibrate_score_ev: true
  save_calibrator: true
  calibration_seed: 42

rare_events:
  enabled: true
  tau: null
  use_sample_weights: true
  weight_method: "king_zeng"
  correction_method: "king_zeng"

meta:
  enabled: true
  threshold_primary: 0.20
  target:
    kind: "y_positive"
  features:
    include_primary_prob: true
    include_primary_logit: true
    include_original_features: true
  model:
    kind: "lgbm"
    params:
      n_estimators: 150
      learning_rate: 0.05
      num_leaves: 15
      max_depth: 3
      min_child_samples: 100
      subsample: 0.8
      subsample_freq: 5
      colsample_bytree: 0.8
      reg_alpha: 0.3
      reg_lambda: 0.3
  output:
    write_meta_predictions: true
    write_meta_model: true
# End of file
