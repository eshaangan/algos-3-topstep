# Topstep-strict backtest config with higher trade frequency (threshold=0.05).

decision:
  use_meta: false
  primary_score_column: "score_ev"
  primary_threshold: 0.05
  meta_threshold: 0.50
  require_meta_for_trade: false

  volatility_filter:
    enabled: false
    min_sigma: 7.0

  regime_filter:
    enabled: true
    vol_window: 20
    trend_window: 50
    enable_shorts: false
    skip_regimes: [6, 7]
    threshold_boost_regimes: [3]
    threshold_boost: 0.03

sizing:
  contracts: 1
  max_concurrent_positions: 1

costs:
  use_execution_spec: true
  use_event_ret_net: true

risk:
  use_risk_yaml: true

session:
  trade_start_time_chicago: "08:30"
  trade_end_time_chicago: "15:00"
  flatten_time_chicago: "14:55"

outputs:
  write_trade_log: true
  write_equity_curve: true

