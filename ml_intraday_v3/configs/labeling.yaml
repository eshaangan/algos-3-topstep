# Labeling configuration - triple barrier + meta-labeling
# Version: 1.0

# Primary model labeling (directional prediction)
primary_labeling:
  # Event generation policy: "every_bar" or "filtered"
  # "every_bar": generate event at every bar (baseline, minimal selection bias)
  # "filtered": generate events only when primary_filter conditions met
  event_policy: "every_bar"

  # Primary filter (only used if event_policy == "filtered")
  # Not implemented in baseline; reserved for future use
  primary_filter: null

  # Triple barrier parameters
  triple_barrier:
    # Volatility estimator for barrier scaling
    # Options: "atr", "std", "parkinson", "ewma_std"
    volatility_estimator: "atr"

    # Volatility lookback (in bars)
    volatility_lookback:
      "1m": 20   # 20 bars for 1m
      "5m": 20   # 20 bars for 5m

    # Volatility estimator params (ATR period for ATR method)
    volatility_params:
      atr_period: 14

    # Profit target multiples (grid search over these)
    pt_multipliers:
      - 1.0
      - 1.5

    # Stop loss multiples (grid search over these)
    sl_multipliers:
      - 1.0
      - 1.5

    # Vertical barrier horizons in bars (grid search over these)
    # Must match execution_spec.max_holding_bars
    horizon_bars:
      "1m": [12, 24]   # 12 min, 24 min
      "5m": [12, 24]   # 60 min, 120 min

    # First-touch label encoding
    # +1: profit target hit first
    # -1: stop loss hit first
    #  0: vertical barrier hit first (or tie)
    label_encoding:
      target_first: 1
      stop_first: -1
      vertical: 0

    # Cost accounting in barriers
    # If true, adjust barriers to account for slippage/commission
    # Recommended: true (conservative, execution-aligned)
    account_for_costs: true

    # Cost source: must reference execution_spec.yaml
    # This ensures label/backtest cost parity
    use_execution_spec_costs: true

# Meta-labeling (secondary model for position sizing/filtering)
meta_labeling:
  # Enable meta-labeling
  enabled: false  # Disabled in initial baseline

  # Meta event policy: "on_primary_signals" or "every_bar"
  # "on_primary_signals": generate meta events only when primary model signals
  meta_event_policy: "on_primary_signals"

  # Meta label target: "binary_correct" or "magnitude"
  # "binary_correct": 1 if primary prediction correct, 0 otherwise
  # "magnitude": signed return magnitude
  meta_label_target: "binary_correct"

  # Meta barrier (typically same as primary)
  # Inherits triple_barrier config from primary unless overridden
  inherit_primary_barriers: true

# Sample weights configuration
sample_weights:
  # Uniqueness weighting (event concurrency-based)
  uniqueness:
    enabled: true

    # Method: "lopez_de_prado" or "simple_overlap"
    method: "lopez_de_prado"

  # Magnitude weighting (return-based)
  magnitude:
    enabled: false  # Disabled in baseline

    # Clip magnitude weights to prevent outlier domination
    clip_quantile: 0.95

  # Combined weight formula: w = uniqueness^a * magnitude^b
  # Only uniqueness used in baseline (magnitude disabled)
  weight_formula:
    uniqueness_exponent: 1.0
    magnitude_exponent: 0.0  # Disabled

# Output paths
output:
  # Primary events
  events_path: "runs/{run_id}/bar_size={bar_size}/events.parquet"

  # Label schema (persisted for reproducibility)
  label_schema_path: "runs/{run_id}/bar_size={bar_size}/label_schema.json"

  # Sample weights
  weights_path: "runs/{run_id}/bar_size={bar_size}/weights.parquet"

  # Meta events (if meta_labeling.enabled)
  meta_events_path: "runs/{run_id}/bar_size={bar_size}/meta_events.parquet"

# Labeling version
labeling_spec_version: "1.0.0"
