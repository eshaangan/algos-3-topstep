# Single OOS window: 2026 YTD through mid-April (limited by mes_2026_ytd_rth_5m.h5).
# Gates are permissive; this file exists only to drive run_standalone_topstep_candidate.

data:
  bar_size: "5m"
  additional_paths:
    - "data/processed/mes_2026_ytd_rth_5m.h5"

training_window:
  lookback_days: 180
  gap_days: 0

windows:
  - name: "ytd_2026_jan_apr"
    test_start: "2026-01-01"
    test_end: "2026-04-12"

gates:
  min_train_events: 1
  min_test_events: 1
  min_test_auc: 0.0
  min_test_accuracy: 0.0
  min_total_pnl_usd: -1.0e9
  min_avg_trade_usd: -1.0e9
  min_profit_factor: 0.0
  min_win_rate: 0.0
  min_trades_count: 0
  min_positive_prediction_rate: 0.0
  max_drawdown_usd: 1.0e9
  max_mtm_daily_liquidations: 999
  max_mtm_trailing_liquidations: 999
  min_long_share: 0.0
  max_long_share: 1.0
  min_short_share: 0.0
  max_short_share: 1.0
  require_all_windows: false
  min_pass_ratio: 0.0
  min_total_pnl_usd_overall: -1.0e9
  min_long_share_overall: 0.0
  max_long_share_overall: 1.0
  min_short_share_overall: 0.0
  max_short_share_overall: 1.0
