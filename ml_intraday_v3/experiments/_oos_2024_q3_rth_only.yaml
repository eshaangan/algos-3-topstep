# Three monthly OOS windows in 2023–2024 (fully inside mes_bars_databento_rth.h5).
# No 2026 YTD merge — use --data-path mes_bars_databento_rth.h5 only.

data:
  bar_size: "5m"
  additional_paths: []

training_window:
  lookback_days: 180
  gap_days: 0

windows:
  - name: "jul_2024"
    test_start: "2024-07-01"
    test_end: "2024-07-31"
  - name: "aug_2024"
    test_start: "2024-08-01"
    test_end: "2024-08-31"
  - name: "sep_2024"
    test_start: "2024-09-01"
    test_end: "2024-09-30"

gates:
  min_train_events: 250
  min_test_events: 30
  min_test_auc: 0.52
  min_test_accuracy: 0.50
  min_total_pnl_usd: 0.0
  min_avg_trade_usd: 3.0
  min_profit_factor: 1.05
  min_win_rate: 0.45
  min_trades_count: 10
  min_positive_prediction_rate: 0.02
  max_drawdown_usd: 1200.0
  max_mtm_daily_liquidations: 0
  max_mtm_trailing_liquidations: 0
  min_long_share: 0.20
  max_long_share: 0.80
  min_short_share: 0.20
  max_short_share: 0.80
  require_all_windows: true
  min_pass_ratio: 1.0
  min_total_pnl_usd_overall: 500.0
  min_long_share_overall: 0.25
  max_long_share_overall: 0.75
  min_short_share_overall: 0.25
  max_short_share_overall: 0.75
