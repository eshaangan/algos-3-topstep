# Multi-year OOS: one window per calendar year (RTH bars only).
# Permissive gates — this is for aggregate PnL / diagnostics, not promotion.
# Data: --data-path data/processed/mes_bars_databento_rth.h5 (no 2026 merge).

data:
  bar_size: "5m"
  additional_paths: []

training_window:
  lookback_days: 180
  gap_days: 0

windows:
  - name: "y2022"
    test_start: "2022-01-01"
    test_end: "2022-12-31"
  - name: "y2023"
    test_start: "2023-01-01"
    test_end: "2023-12-31"
  - name: "y2024"
    test_start: "2024-01-01"
    test_end: "2024-12-31"
  - name: "y2025_ytd"
    test_start: "2025-01-01"
    test_end: "2025-12-18"

gates:
  min_train_events: 1
  min_test_events: 1
  min_test_auc: 0.0
  min_test_accuracy: 0.0
  min_total_pnl_usd: -1.0e9
  min_avg_trade_usd: -1.0e9
  min_profit_factor: 0.0
  min_win_rate: 0.0
  min_trades_count: 0
  min_positive_prediction_rate: 0.0
  max_drawdown_usd: 1.0e9
  max_mtm_daily_liquidations: 999
  max_mtm_trailing_liquidations: 999
  min_long_share: 0.0
  max_long_share: 1.0
  min_short_share: 0.0
  max_short_share: 1.0
  require_all_windows: false
  min_pass_ratio: 0.0
  min_total_pnl_usd_overall: -1.0e9
  min_long_share_overall: 0.0
  max_long_share_overall: 1.0
  min_short_share_overall: 0.0
  max_short_share_overall: 1.0
