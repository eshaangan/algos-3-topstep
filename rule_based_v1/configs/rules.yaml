# Rule-Based Trading System - Rule Parameters
# Instrument: MNQ (Micro NASDAQ) — P(pass/14d)=51%, median=11d, WR=56.7%

# PRIMARY signal: Opening Range Breakout
# Best config confirmed on Jan-Feb 2026 OOS (MNQ): WR=56.7%, P(pass/40d)=68.6%
opening_range_breakout:
  or_end_time: "10:04"          # OR window: 09:30-10:04 ET (7 bars) — first signal at 10:05
  min_or_bars: 7                # Need at least 7 bars in OR window
  min_range_atr: 0.3            # Range must be >= 0.3x ATR (filters flat opens)
  entry_cutoff_time: "12:00"    # No new entries after noon
  atr_period: 14
  use_close_for_signal: true    # Trigger on close > range_high (confirmed break)
  long_only: true               # SHORT side WR=33% (2026 YTD) — below breakeven for 3.0/1.5 system; long-only confirmed best
  require_prev_vwap: true       # PrevVWAP gate: only trade days where prior close > prior VWAP (bullish alignment)
                                # Extended 162d: PrevVWAP+SkipGapUp = WR=52.6%, Sharpe=6.02, DD=-$906, P(pass)=84.7%
  skip_gap_up_pct: 0.003        # Skip days where today opened >0.3% above prior close (overextended opens
                                # that revert instead of break). Extended 162d validation: key to P(pass)=84.7%
  require_gex_explosive: false  # GEX proxy filter — DISABLED for combine (N=10 too small); enable on PRACTICE only
                                # Backtest: PrevVWAP+GEX = 10t, 80% WR, Sharpe=10.08, DD=-$796

time_of_day:
  # Eastern Time
  session_start: "09:35"
  session_end: "15:45"
  lunch_filter_enabled: false
  lunch_start: "12:00"
  lunch_end: "13:00"

exit_strategy:
  profit_target_atr: 3.0         # Reverted to 3.0 — extended 162d test (Aug25-Mar26):
                                  # PT=3.0x: Sharpe=6.02, DD=-$906 (with PrevVWAP+SkipGapUp)
                                  # PT=2.0x was overfitted to 2026 YTD bear regime (Sharpe→ -2.11 on extended data)
  stop_loss_atr: 1.5
  time_stop_bars: 24
  trailing_activation_atr: 999.0  # DISABLED - trailing stop cuts winners
  trailing_distance_atr: 0.75

msite:
  enabled: true
  n_contracts: 15             # scaled from 12x — sweep: no DD change, +$999 PnL, Sharpe 5.50→5.61
  pt_mult: 2.0
  sl_frac: 0.55
  afternoon_cutoff: [14, 0]
  time_stop_bars: 12

gire:
  enabled: true
  g_star: 0.2              # gap ≥ 0.2×ATR to qualify
  clv_thresh: 0.8          # CLV_y ≥ 0.8 for SHORT, ≤ 0.2 for LONG
  use_opening_failure: true
  time_stop_hour: 12       # time stop at 12:00 ET
  n_contracts: 6           # scaled from 5x — sweep: no DD change, +$378 PnL, Sharpe 5.50→5.65
  time_stop_bars: 48       # fallback bar count
  afternoon_cutoff: [12, 0]
