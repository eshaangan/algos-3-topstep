# Risk Management Configuration
# Designed for Topstep 50k Combine

position:
  contracts: 2              # P0-A: reduced from 3 — Feb 13 took -$1,452 at 3c, pushing cumulative DD past $2k limit
  instrument: "MNQ"
  tick_size: 0.25
  tick_value: 0.50          # $0.50 per tick for MNQ
  point_value: 2.0          # $2.00 per point for MNQ

daily_limits:
  max_daily_loss: -700.0    # P0-A: tightened from -950; at 2c worst-case day loss ~$650, adds buffer
  per_trade_max_loss: 1000.0

circuit_breaker:
  max_consecutive_losses: 3
  cooldown_bars: 3

session:
  flatten_minutes_before_close: 5
  session_close: "16:00"    # ET
  max_trades_per_day: 1     # 1 trade/day: WR=73%, Sharpe=4.95 vs 2 trades WR=55%, Sharpe=0.34

drawdown:
  # Topstep trailing max drawdown $2,000; stop at $1,950 ($50 buffer)
  buffer_from_max: 1950.0
