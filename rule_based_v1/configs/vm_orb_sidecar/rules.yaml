# ORB-only sidecar for VM (run alongside MES ML). MSITE/GIRE off — one system, one primary logic.
# Instrument still MNQ per rule math (point_value in risk.yaml). Use MNQ Topstep contract id in env.

opening_range_breakout:
  or_end_time: "10:04"
  min_or_bars: 7
  min_range_atr: 0.3
  max_or_range_atr: 5.0
  entry_cutoff_time: "12:00"
  atr_period: 14
  use_close_for_signal: true
  long_only: true
  require_prev_vwap: true
  skip_gap_up_pct: 0.005
  require_gex_explosive: false

prev_vwap_bearish_override:
  enabled: true
  min_score: 4
  require_breakout: true
  min_gap_up_pct: 0.001
  min_drive_from_open_atr: 0.75
  min_or_range_atr: 0.8
  min_breakout_excess_atr: 0.15
  min_volume_ratio: 1.1

time_of_day:
  session_start: "09:35"
  session_end: "15:45"
  lunch_filter_enabled: false
  lunch_start: "12:00"
  lunch_end: "13:00"

exit_strategy:
  profit_target_atr: 3.0
  stop_loss_atr: 1.5
  time_stop_bars: 24
  trailing_activation_atr: 999.0
  trailing_distance_atr: 0.75

msite:
  enabled: false

gire:
  enabled: false

vwap_mean_reversion:
  enabled: false  # SURVIVAL MODE: disabled — too much DD variance with $500 buffer
  entry_distance_atr: 1.0
  max_distance_atr: 3.0
  atr_period: 14
  time_start: "10:30"
  time_end: "13:30"
  long_only: true
  profit_target_atr: 2.0
  stop_loss_atr: 1.5
  time_stop_bars: 12
  max_trades: 2
  max_move_from_open_atr: 2.0  # was 1.0; relaxed to allow more setups (+37% signals)

ofi_filter:
  enabled: false
  ofi_long_threshold: 0.2
  ofi_short_threshold: 0.2
  top_levels: 5
  pass_through_if_disconnected: true

# Volatility Clustering directional filter — superseded by 3d momentum filter below.
# 2026 YTD at 5c: WR 55.2%, $9,944 PnL, -$1,282 DD (weaker than momentum filter).
volatility_clustering:
  enabled: false
  lookback_days: 10
  require_wide_range: true
  require_direction_match: true
  pass_through_on_no_history: true

# 3-day momentum filter: only enter LONG ORB when prior 3-day return > -1%.
# Blocks breakouts into sustained multi-day downtrends.
# 2026 YTD at 5c: 37 trades, 70.3% WR, $15,548 PnL, -$1,417 DD, Sharpe 7.91
# (vs VC directional: 28 trades, 64.3% WR, $9,944 PnL, -$1,910 DD)
momentum_filter:
  enabled: true
  lookback_days: 3           # 3-day rolling return window
  threshold: -0.01           # block if 3d return ≤ -1%
  pass_through_on_no_history: true  # allow trade when < 4 days of history

# PSS veto — disable in SURVIVAL MODE (fires ~5% of days, marginal EV, every trade counts)
# Re-enable (enabled: true) after recovering to positive territory.
pss_veto:
  enabled: false
  fs_threshold: 0.80         # failure score threshold (0.80 = original, 1.80 = only extreme events)
