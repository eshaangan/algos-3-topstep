# ORB sidecar — 10 MNQ contracts, funded account.
# Topstep 50k funded hard limits: $1,000/day loss, $2,000 trailing drawdown.
# At 10 MNQ, one SL ≈ $1,200 — circuit breaker stops after 1 consecutive loss.

position:
  contracts: 10             # 50k funded account
  instrument: "MNQ"
  tick_size: 0.25
  tick_value: 0.50
  point_value: 2.0
  commission_per_side: 0.62

daily_limits:
  max_daily_loss: -1600.0   # 10 MNQ: allows up to 2 losing trades before daily halt
  per_trade_max_loss: 1800.0

circuit_breaker:
  max_consecutive_losses: 3  # allow ORB loss + 2 VWAP attempts before full stop
  cooldown_bars: 3

session:
  flatten_minutes_before_close: 5
  session_close: "16:00"
  max_trades_per_day: 5     # ORB(1) + VWAP(2) + buffer; was 2 blocking VWAP after ORB

drawdown:
  buffer_from_max: 1950.0   # Topstep funded 50k trailing max DD $2,000; $50 buffer
