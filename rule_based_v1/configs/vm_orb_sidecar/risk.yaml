# SURVIVAL MODE — 50k funded account at -$1,500 (~$500 DD buffer remaining)
# Goal: recover without blowing account. Scale back up after positive.
# At 3 MNQ: avg win ~$410, avg loss ~$300. One loss still leaves ~$200 buffer.

position:
  contracts: 3              # SURVIVAL: reduced from 10 MNQ; one SL = ~$300
  instrument: "MNQ"
  tick_size: 0.25
  tick_value: 0.50
  point_value: 2.0
  commission_per_side: 0.62

daily_limits:
  max_daily_loss: -350.0    # 3 MNQ: hard stop after one losing ORB trade
  per_trade_max_loss: 400.0

circuit_breaker:
  max_consecutive_losses: 1  # stop immediately after any loss — protect remaining $500
  cooldown_bars: 5

session:
  flatten_minutes_before_close: 5
  session_close: "16:00"
  max_trades_per_day: 1     # ORB only — one shot per day, best setup only

drawdown:
  buffer_from_max: 450.0    # Only $500 left; stop trading if within $50 of DD limit
