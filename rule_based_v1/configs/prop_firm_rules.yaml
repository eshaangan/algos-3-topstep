    balance: 50000
    profit_target: 3000
    max_loss_limit: 2000
    drawdown_type: end_of_day_trailing
    locks_at_starting_balance: true
    daily_loss_limit: null
    consistency: 0.50
    min_trading_days: 2
    flatten_et: "16:45"
    resumes_et: "18:00"
    overnight_permitted: false
