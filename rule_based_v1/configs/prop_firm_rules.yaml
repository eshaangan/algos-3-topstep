# TRACK B — surveyed prop-firm rule sets, machine-readable.
#
# Why this file exists: the same reason account_rules.yaml exists. Firm rules carried in
# prose got this project's P(pass) numbers wrong for months. Nothing here may be
# retyped into a script; load it with tzguard.load_firm_rules().
#
# STATUS: web-sourced from public rule pages + independent aggregator reviews,
# retrieved 2026-09-05. NONE are confirmed against a real account dashboard.
# `verified` is false everywhere until someone checks in-app. Treat every P(pass)
# computed from these as provisional.
#
# The decisive field is `flatten_et`. A firm with flatten_et: null imposes no daily
# auto-liquidation, which is the ONLY thing standing between this project's validated
# book and a pass.

retrieved: "2026-09-05"

firms:

  lucid_flex_100k:
    label: "LucidFlex 100k (incumbent)"
    # VERIFIED 2026-09-09 against Lucid's own help centre (support.lucidtrading.com),
    # not against an account dashboard. Every field below that the help centre states
    # explicitly is quoted in `verified_quotes`. Automated fetch needs a browser
    # User-Agent -- the site 403s a bare request, which is why this went unchecked.
    verified: help_centre_2026_09_09
    # ACCOUNT CONFIRMED BY USER 2026-09-09 from the Lucid dashboard:
    #   LFE100-Z96Y99ZR-TEST001 | LUCIDFLEX 100K | EVAL | EOD DRAWDOWN | NO DLL | Active
    # The "TEST001" suffix is Lucid's naming for an evaluation account, NOT a demo.
    # Confirms drawdown_type=end_of_day_trailing and daily_loss_limit=null below.
    account_id: "LFE100-Z96Y99ZR-TEST001"
    account_status: "EVAL, active, confirmed on dashboard 2026-09-09"
    balance: 100000
    profit_target: 6000
    max_loss_limit: 3000
    drawdown_type: end_of_day_trailing
    locks_at_starting_balance: true
    daily_loss_limit: null
    consistency: 0.50           # evaluation only
    min_trading_days: 2
    flatten_et: "16:45"         # MANDATORY daily auto-flatten Mon-Fri
    resumes_et: "18:00"         # "Trading resumes at 6:00 PM EST, Sunday through Thursday"
    # CORRECTED 2026-09-09. These were both `false`, which contradicted this firm's own
    # rule structure (myfundedfutures, with the identical shape, is marked true) and
    # contradicted tzguard's legality logic, which correctly rules an 18:00 -> next-day
    # 16:45 hold LEGAL. The flatten is the ONLY constraint: there is no separate
    # prohibition on holding through the night or over a Sunday. The Sunday case is
    # settled by the reopen being Sunday 6:00 PM ET.
    # NOTE: these two keys are metadata only. tzguard reads flatten_et/resumes_et, and
    # its `overnight_permitted` comes from account_rules.yaml, not from here.
    overnight_permitted: true   # 18:00 entry may be held to 16:45 the NEXT day
    weekend_permitted: true     # Sunday 18:00 entry is inside the reopen window
    news_restriction: none_documented
    max_size: "6 minis or 60 micros"   # 100k tier; 25k=2/20, 50k=4/40, 150k=10/100
    prohibited_practices:
      microscalping: ">50% of profits from trades held 5 seconds or less"
      hft: "hundreds of orders within minutes"
      hedging: "OPPOSING positions across MULTIPLE ACCOUNTS -- not an intra-account spread"
    verified_quotes:
      allowed_trading_times: >
        "All positions must be closed by 4:45 PM EST, Monday through Friday. Any open
        positions will be automatically closed by Lucid Trading at 4:45 PM EST.
        Important: Holding a position past this time does not result in a failed
        account. Market Reopen Times: Trading resumes at 6:00 PM EST, Sunday through
        Thursday. On market holidays with altered closing times, all positions must be
        closed before the market closes, regardless of the usual 4:45 PM cutoff."
      funded_consistency: >
        "LucidFlex funded accounts have an optional Daily Loss Limit, no consistency
        rule and no payout buffer. 90/10 profit split. EOD trailing drawdown."
      sizes: "$100,000 -> Max Loss Limit $3,000, max size 6 mini or 60 micros"
    sources:
      - https://support.lucidtrading.com/en/articles/11404729-allowed-trading-times
      - https://support.lucidtrading.com/en/articles/12945795-lucidflex-funded-account
      - https://support.lucidtrading.com/en/articles/11404742-prohibited-microscalping
      - https://support.lucidtrading.com/en/articles/11404736-prohibited-high-frequency-trading
      - https://support.lucidtrading.com/en/articles/11404734-prohibited-hedging

  myfundedfutures_pro_100k:
    label: "MyFundedFutures Pro/Core 100k"
    verified: false
    balance: 100000
    profit_target: 6000
    max_loss_limit: 3000        # 3% of starting balance
    drawdown_type: end_of_day_trailing
    locks_at_starting_balance: true   # locks at start + $100
    daily_loss_limit: null
    consistency: 0.50
    min_trading_days: 2
    flatten_et: "16:10"         # auto-liquidation at 16:10 ET, non-holiday days
    resumes_et: "18:00"
    overnight_permitted: true   # 18:00 entry may be held to 16:10 NEXT day
    weekend_permitted: false    # the 16:10 flatten runs every weekday incl. Friday
    news_restriction: tier1_flat_2min   # FOMC/CPI/NFP: flat 2 min either side
    note: >
      Aggregators advertise MFF as allowing overnight holds, and in the same sense
      Lucid does -- an evening entry survives to the next afternoon. But the official
      help centre states open positions are AUTO-CLOSED at 16:10 ET on every regular
      trading day, which is STRICTER than Lucid's 16:45. MFF is not an escape from the
      flatten. It also adds a Tier-1 news restriction Lucid does not have, which
      constrains an FOMC strategy from the other side.
    sources:
      - https://help.myfundedfutures.com/en/articles/9558251-permitted-times-to-trade
      - https://help.myfundedfutures.com/en/articles/8230009-news-trading-policy

  phidias_swing_100k:
    label: "Phidias Swing/Premium 100k"
    verified: false
    balance: 100000
    profit_target: 6000
    max_loss_limit: 3000
    drawdown_type: end_of_day_trailing
    locks_at_starting_balance: true
    daily_loss_limit: null
    consistency: null           # NO consistency rule on the evaluation
    min_trading_days: 1
    flatten_et: null            # NO mandatory daily flatten -- the decisive difference
    resumes_et: "18:00"
    overnight_permitted: true
    weekend_permitted: true     # Friday close -> Monday open holds explicitly allowed
    news_restriction: none      # news trading allowed on all accounts
    position_cap_micros: 140
    sources:
      - https://damnpropfirms.com/futures-prop-firms/phidias-prop-firm/
      - https://saveonpropfirms.com/prop-firms/phidias-prop-firm
      - https://phidiaspropfirm.com/swing-allowed   # 403s to automated fetch; check in a browser
    note: >
      Identical headline arithmetic to LucidFlex 100k -- same $6,000 target, same
      $3,000 EOD-trailing MLL -- but with no daily flatten and no evaluation
      consistency rule. If these numbers hold up in-app, every window this project
      validated becomes legal, including the 14:00/16:00 fomc_drift_v1 entries that
      Lucid's flatten force-closes.

  elite_trader_funding_diamond_100k:
    label: "Elite Trader Funding 'Diamond Hands' 100k"
    verified: false
    balance: 100000
    profit_target: 5000
    max_loss_limit: 3500
    drawdown_type: end_of_day_trailing
    daily_loss_limit: 1500      # measured from prior day's closing balance
    consistency: null
    min_trading_days: 5
    flatten_et: null
    resumes_et: "18:00"
    overnight_permitted: true
    weekend_permitted: true
    news_restriction: unknown
    note: >
      Lower target ($5,000) and a bigger buffer ($3,500) than Lucid, and it permits
      weekend holds -- but it reintroduces a $1,500 DAILY loss limit, which is exactly
      the constraint a single bad weekend gap breaches. Worth modelling only if the
      daily limit is applied to closed equity rather than open drawdown.
    sources:
      - https://elitetraderfunding.app/blog/swing-trading-prop-firms-which-allow-overnight-holds-2026

  # --- Smaller LucidFlex tiers. Added 2026-09-05 after the required-edge frontier showed
  # the binding geometry is the TARGET/MLL RATIO, not the edge. The 100k pairs a $6,000
  # target with $3,000 of room (ratio 2.0); the 25k pairs $1,250 with $1,000 (ratio 1.25).
  # Same book, same rules, a fundamentally easier problem. Numbers from accounts: in
  # account_rules.yaml -- the single source of truth -- not retyped from a web page.

  lucid_flex_25k:
