# Risk Management Configuration — Lucid Flex 100k
# MLL: $3,000 (EOD trailing) | No daily loss limit | Profit target: $6,000

position:
  contracts: 6              # Lucid 100k max = 6 MNQ micros
  instrument: "MNQ"
  tick_size: 0.25
  tick_value: 0.50
  point_value: 2.0

daily_limits:
  max_daily_loss: -1500.0   # Internal protection only (no DLL on LucidFlex); conservative
  per_trade_max_loss: 800.0 # ~67pts per trade; 3 max losses = $2,400 (within MLL)

circuit_breaker:
  max_consecutive_losses: 3
  cooldown_bars: 3

session:
  flatten_minutes_before_close: 5
  session_close: "16:00"    # ET (Lucid requires flat by 16:45 ET — well within limit)
  max_trades_per_day: 3

drawdown:
  # Lucid 100k MLL $3,000 (EOD trailing); halt at $2,700 ($300 buffer)
  buffer_from_max: 2700.0
