# Risk Management Configuration — Lucid Flex 100k
# MLL: $3,000 (EOD trailing from peak) | No daily loss limit | Profit target: $6,000
# Contract limit: 6 MNQ micros

account:
  initial_balance: 100000.0   # Starting equity for MLL calculation
  mll_limit: 3000.0           # Maximum Loss Limit (trailing from peak, checked EOD)
  profit_target: 6000.0       # Combine profit target

position:
  contracts: 5                # v3 balanced sizing (median ~20 days, 99.4% pass, 0.6% bust)
  instrument: "MNQ"
  tick_size: 0.25
  tick_value: 0.50
  point_value: 2.0
  commission_per_side: 0.62

daily_limits:
  max_daily_loss: -1500.0     # Conservative internal cap (50% of MLL); overridden dynamically at startup
  per_trade_max_loss: 800.0   # ~80pts per trade at 5c; keeps single loss well within MLL

circuit_breaker:
  max_consecutive_losses: 3
  cooldown_bars: 3            # matches v3 CFG cooldown_bars

session:
  flatten_minutes_before_close: 5   # Flatten at 17:10 ET (after last natural exit ~17:00)
  session_close: "17:15"            # ET; last v3 entry ~16:00 ET, time-stops by ~17:00 ET
  max_trades_per_day: 6             # v3 validated at 6/day (matches model config)

drawdown:
  # Halt at $2,700 drawdown from peak (leaves $300 MLL buffer)
  buffer_from_max: 2700.0
  min_remaining_mll: 500.0          # Refuse to trade if less than $500 MLL remaining
