# Same economics as vm_orb_mnk — Micro Nikkei (USD).

position:
  contracts: 1
  instrument: "MNK"
  tick_size: 5.0
  tick_value: 2.5
  point_value: 0.5
  commission_per_side: 0.62

daily_limits:
  max_daily_loss: -950.0
  per_trade_max_loss: 1000.0

