# Risk Management Configuration — Topstep 150k Combine
# Mirrors risk.yaml but scaled for larger account limits.
# Daily loss limit: ~$3,000 | Trailing max drawdown: ~$6,000

position:
  contracts: 6              # ML strategy default; override via ML_N_CONTRACTS env
  instrument: "MNQ"
  tick_size: 0.25
  tick_value: 0.50
  point_value: 2.0

daily_limits:
  max_daily_loss: -2000.0   # Conservative: $2k limit vs $3k allowed; protects combine phase
  per_trade_max_loss: 1500.0

circuit_breaker:
  max_consecutive_losses: 3
  cooldown_bars: 3

session:
  flatten_minutes_before_close: 5
  session_close: "16:00"    # ET
  max_trades_per_day: 3     # ML strategy validated cap

drawdown:
  # Topstep 150k MLL $4,500; halt at $4,000 ($500 buffer)
  buffer_from_max: 4000.0
