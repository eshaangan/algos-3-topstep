# VPS Morning Rip Strict — standalone prereg for the CSV gauntlet.
# Holdout 2025-01-01 → 2026-07-01 is ALREADY-INSPECTED history (honest note:
# not a pristine sealed window; used as a disciplined re-evaluation floor).

strategy_id: vps_morning_rip

holdout:
  start: "2025-01-01"
  end:   "2026-07-01"

# Honest floor: Morning Rip was researched across many configs; under-counting inflates DSR.
dsr_n_trials: 15

gate:
  # Execution-realism gate (added 2026-09-05). Three synthetic trade books
  # cleared every statistical test here (DSR 1.000) because DSR faithfully
  # scores whatever numbers it is handed. These check the numbers are fills.
  require_execution_realism: true
  require_bracket_disclosure: true   # external book: omission must not dodge the check
  max_exact_stop_frac: 0.90        # stops gap and slip; ~1.0 means synthetic
  min_distinct_pnl_ratio: 0.05     # fixed-payout books have ~2 values
  max_bracket_z: 5.0               # excess over barrier-touch probability
  min_oos_trades: 60
  min_months: 6
  min_positive_month_fraction: 0.67
  require_net_profitable: true
  min_dsr: 0.95
  max_drawdown_usd: 2700

# Minimal MNQ economics stub (CSV path supplies realized pnl; sim unused).
sim:
  point_value: 2.0
  tick_size: 0.25
  commission_per_side: 0.62
