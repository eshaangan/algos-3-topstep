# ─────────────────────────────────────────────────────────────────────────────
# PRE-REGISTERED VALIDATION RULE
#
# Fill this out and commit it BEFORE you look at the holdout. The harness hashes
# the holdout / dsr_n_trials / gate / sim blocks; editing any of them after an
# evaluation is recorded shows up in holdout_ledger.jsonl as a changed hash —
# i.e. the harness will tell on you. That is the entire point: it makes the
# decision honest by fixing it in advance.
#
# WORKFLOW FOR A NEW MODEL
#   1. Decide the holdout window NOW (most recent ~6 months ideally). Never train,
#      tune, or threshold-pick on it.
#   2. Set dsr_n_trials to the HONEST number of configs you searched (grid size,
#      thresholds tried, feature sets, etc.). Under-counting inflates the DSR.
#   3. Do all development on data BEFORE holdout.start.
#   4. Run validate_model.py --commit-holdout exactly once. Read the verdict.
#      If NO-GO, the strategy is dead — do not re-tune against the holdout.
# ─────────────────────────────────────────────────────────────────────────────

strategy_id: ml_strategy_mnq_v3

holdout:
  # Frozen out-of-sample window. The deployed v3 model trained through 2026-02-28,
  # so everything from March on is genuinely OOS for it. NOTE: this window was
  # already inspected during the June 2026 review, so for the *current* model it
  # is a demonstration, not a pristine holdout. For the NEXT model, set this
  # before training.
  start: "2026-03-01"
  end:   "2026-06-01"

# Number of configurations effectively searched, for the DSR selection-bias
# penalty. ml_strategy_search.py swept hundreds of (pt, sl, lookahead, conf, mt)
# combos and selected on OOS PnL; 50 is a deliberately conservative floor.
dsr_n_trials: 50

# ── Decision rule (conjunctive: ALL must pass for GO) ────────────────────────
gate:
  # Sample-size floor. The honest target once 3+ years of data exists is >=150
  # trades spanning >=6 months. 60 is the achievable floor on the current
  # 6-month dataset — raise it as data grows.
  min_oos_trades: 60
  min_months: 3
  # Require the edge to hold across months, not in one lucky window. 0.67 = at
  # least 2 of 3 months net positive.
  min_positive_month_fraction: 0.67
  require_net_profitable: true
  # Deflated Sharpe: probability the edge is real after the selection-bias and
  # non-normality penalties. 0.95 ≈ p < 0.05.
  min_dsr: 0.95
  # Capital-preservation bound: leave >= $300 of the $3k Lucid MLL (at the
  # n_contracts below). Scale this with n_contracts.
  max_drawdown_usd: 2700

# ── Simulator + adapter parameters (must match how the model is actually run) ─
sim:
  # Execution (consumed by SimParams)
  pt_atr: 2.0
  sl_atr: 1.0
  horizon_bars: 12
  cooldown_bars: 3
  max_trades_per_day: 6
  point_value: 2.0
  tick_size: 0.25
  commission_per_side: 0.62
  slippage_ticks: 1
  n_contracts: 1
  # Adapter (consumed by validate_model.py to turn probabilities into signals)
  conf: 0.248
  min_atr_pts: 5.0
  long_only: true

# ── pre-registered 2026-07-08 (frozen BEFORE any holdout contact) ────────────
ask_cancel_pull_v1:
  hypothesis: >
    Ask-side liquidity withdrawal (cancels, not consumption) precedes short-term
    price declines. Asymmetric/short-only; bid side explicitly NOT claimed.
  event_spec:
    side: ask
    min_prev_sz: 5
    drop_frac: 0.40           # size falls to <=40% of prior within <=2s, px unchanged
    cancel_frac_min: 0.70     # (drop - aggressive buy vol in window) / drop
    session: "13:30-20:00 UTC (RTH)"
    de_overlap_secs: 30
  evaluation:
    data: holdout days >= 2026-06-27, UNTOUCHED as of registration
    test_date: 2026-07-25     # single shot, alongside the imb_fade_midday re-test
    metric: drift-adjusted mean forward mid move at 60s/120s
    go_criteria: "f60 <= -0.8pt AND t(f60) <= -2.0 AND days_negative@60s >= 65%"
    on_pass: simulate as short-only strategy under latency cost model (never fixed)
    on_fail: permanent kill; no threshold re-tuning
  dev_evidence: "f60=-1.10p t=-1.7 n=998, days<0=78% (12 dev days, drift-adjusted)"
  trials_context: "~60 cells examined across 5s-grid + tick-level + drift passes"

# ── pre-registered 2026-07-09 (dev-selected, holdout untouched) ──────────────
range_ignite_v1:
  hypothesis: >
    5-min range-expansion bars closing near their extreme continue over the next
    ~20 minutes on MNQ (momentum ignition at the 5-30min horizon). Supported by
    the inverse evidence: fading the same moves (vwap_fade) lost catastrophically.
  signal_spec:
    bar: 5min from 1s Rithmic bars (tz: bar_end_datetime is naive Chicago)
    entry: bar range >= 1.8 * ATR(14) AND close in top/bottom 25% of bar range
    direction: with the bar (top -> long, bottom -> short)
    session: entries 09:45-15:30 ET
    exits: PT 1.5xATR / SL 1.0xATR / horizon 4 bars; cooldown 2; max 6/day
    costs: harness latency model, decision_lag=3s, 2 contracts MNQ
  dev_evidence: >
    215 days (Jun 2025-Mar 2026): 126tr, WR 50%, +$3,588, DD -$1,152,
    DSR(44 trials)=0.340. Robustness: both eras positive, both directions
    positive, 75% of 36 neighborhood cells positive (median +$856), surface
    strengthens toward looser thresholds (no knife-edge). Caveat: monthly
    consistency only 50%; Jan-Feb 2026 contributes heavily.
  evaluation:
    data: holdout >= 2026-04-01, UNTOUCHED as of registration
    test_date: 2026-07-25   # single shot with ask_cancel_pull_v1 + fade re-test
    go_criteria: "holdout total_pnl > 0 AND DSR >= 0.40 AND positive months >= 50%"
    on_pass: shadow-paper 2 weeks vs live quotes, then live 1-micro shakedown
    on_fail: permanent kill, no re-tuning
  trials_context: "44 cells cumulative in the 5-30min zone (8 families run + 36 surface)"
